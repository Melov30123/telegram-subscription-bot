[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-subscription-bot"
version = "4.0.0"
description = "Production-ready Telegram Stars subscription bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram==3.30.0",
  "aiohttp==3.13.2",
  "APScheduler==3.11.0",
  "asyncpg==0.30.0",
  "pydantic-settings==2.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[project.scripts]
subscription-bot = "subscription_bot.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["subscription_bot*"]

[tool.setuptools.package-data]
subscription_bot = ["migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
